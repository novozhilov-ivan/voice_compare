[project]
name = "voice-compare"
version = "1.0.0"
description = "Voice Speaker Recognition System"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Web Framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",

    # YouTube Download
    "yt-dlp>=2024.0.0",

    # Audio Processing
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "noisereduce>=3.0.0",

    # Speech Recognition & Speaker Analysis
    "speechbrain>=1.0.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.35.0",
    "pyannote-audio>=3.1.0",

    # Voice Activity Detection - optional, fallback to energy-based
    # webrtcvad requires gcc to compile, we'll use energy-based VAD as fallback

    # Transcript Processing
    "youtube-transcript-api>=0.6.1",

    # Utilities
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
webrtc = [
    "webrtcvad>=2.0.10",  # Requires compilation, optional
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["backend"]

version: '3.8'

services:
  voice-compare:
    build: .
    container_name: voice-speaker-recognition
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for persistence
      - ./data/videos:/app/data/videos
      - ./data/audio:/app/data/audio
      - ./data/models:/app/data/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

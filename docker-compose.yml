services:
  voice-compare:
    build: .
    container_name: voice-speaker-recognition
    command: ["uv", "run", "uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for persistence
      - ./data/videos:/app/data/videos
      - ./data/audio:/app/data/audio
      - ./data/models:/app/data/models
    environment:
      - PYTHONUNBUFFERED=1
      - TORCHAUDIO_USE_BACKEND_DISPATCHER=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
